name: 功能建议
description: 建议通用能力、交互或集成改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述使用场景和当前限制。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 包括预期交互、API 或数据边界。
    validations:
      required: true
  - type: textarea
    id: tenant_security
    attributes:
      label: 租户与安全影响
      description: 说明是否涉及跨租户数据、新凭据、新外部服务或权限变化。
