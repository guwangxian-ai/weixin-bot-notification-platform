name: Bug 报告
description: 报告可重现的缺陷（请勿提交密钥、Bot 凭据或微信标识）
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除日志中的令牌、Cookie、个人信息和微信标识。安全漏洞请按 SECURITY.md 私下报告。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 / commit SHA
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python、Node.js、浏览器、投递模式等。
  - type: checkboxes
    id: safety
    attributes:
      label: 敏感信息
      options:
        - label: 我已确认本 Issue 不包含凭据、令牌、Cookie、真实微信标识或个人信息。
          required: true
